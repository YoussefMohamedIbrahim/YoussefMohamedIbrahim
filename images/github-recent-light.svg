





<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="250" viewBox="0 0 480 250" fill="none">
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="var(--shadow)" flood-opacity="0.35" />
        </filter>
        <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="var(--neon-1)" flood-opacity="0.6" />
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="var(--neon-2)" flood-opacity="0.35" />
        </filter>
        <linearGradient id="neonGradient" x1="0" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="var(--neon-1)" />
            <stop offset="100%" stop-color="var(--neon-2)" />
        </linearGradient>
    </defs>

    <style>
        
        :root {
            --bg: #ffffff;
            --card: #f6f8fa;
            --border: #d0d7de;
            --text: #24292f;
            --muted: #57606a;
            --accent: #0969da;
            --neon-1: #0284c7;
            --neon-2: #38bdf8;
            --shadow: rgba(27, 31, 36, 0.12);
        }
        

        .bg { fill: var(--bg); }
        .surface { fill: var(--card); filter: url(#shadow); }
        .border {
            fill: none;
            stroke: var(--border);
            stroke-width: 1;
        }
        .border-neon {
            fill: none;
            stroke: url(#neonGradient);
            stroke-width: 2;
            stroke-linecap: round;
            filter: url(#neonGlow);
        }
        .divider { stroke: var(--border); stroke-width: 1; opacity: 0.6; }

        .title {
            font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", sans-serif;
            font-weight: 600;
            font-size: 18px;
            fill: var(--text);
        }
        .subtitle {
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 0.2px;
            fill: var(--muted);
        }
        .repo-name {
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            font-weight: 600;
            font-size: 12px;
            fill: var(--text);
        }
        .repo-meta {
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            font-weight: 500;
            font-size: 11px;
            fill: var(--muted);
        }
        .repo-desc {
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            font-weight: 500;
            font-size: 10px;
            fill: var(--muted);
        }
        .repo-date {
            font-family: "JetBrains Mono", "SFMono-Regular", "Menlo", monospace;
            font-weight: 600;
            font-size: 11px;
            fill: var(--muted);
        }
        .repo-link {
            cursor: pointer;
            text-decoration: none;
        }
        .repo-link text {
            pointer-events: all;
        }
        .empty {
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            font-weight: 500;
            font-size: 12px;
            fill: var(--muted);
        }

        .enter {
            opacity: 1;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-pattern,
            .border,
            .enter {
                animation: none;
            }
        }
    </style>

    <rect width="480" height="250" class="bg" />
    <g>
        <rect x="14" y="14" width="452" height="222" rx="14" class="surface" />
